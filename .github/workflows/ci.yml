name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim
        ports:
          - 1521:1521
        env:
          ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
          APP_USER: complaint_app
          APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD }}
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Wait for Oracle to be ready
        run: sleep 60

      - name: Run schema scripts
        run: |
          for f in src/main/resources/schema/*.sql; do
            echo "Running $f"
            docker exec $(docker ps -q --filter ancestor=gvenzl/oracle-xe:21-slim) \
              sqlplus -s complaint_app/${{ secrets.APP_USER_PASSWORD }}@localhost:1521/XEPDB1 @$f
          done

      - name: Run tests
        run: mvn -B verify
